# AyurAI Component 4 — Docker setup
#
#   docker compose up --build                           -> federated server + 3 clinic nodes
#   docker compose --profile db up -d postgres neo4j    -> databases only (profile "db")
#
# Values like ${EPSILON} come from component4/.env (copy .env.example) or the shell.

services:
  # ---------- Federated learning ----------
  server:
    build: .                        # builds the image from component4/Dockerfile
    image: ayurai-c4-federated      # the clinic services reuse this same image
    command: ["python", "federated/server.py"]
    environment:
      EPSILON: ${EPSILON:-2.0}      # privacy budget; only used to name the results CSV
    ports:
      - "8080:8080"                 # Flower's gRPC port, also reachable from the host
    volumes:
      - ./results:/app/results      # CSVs written in the container appear in component4/results

  clinic1:
    image: ayurai-c4-federated
    pull_policy: never              # the image is built locally by "server", never downloaded
    command: ["python", "federated/client.py", "1", "${EPSILON:-2.0}"]
    environment:
      SERVER_ADDRESS: server:8080   # "server" = the server container's name on the compose network
    depends_on: [server]            # start after the server container
    restart: on-failure             # retry if a clinic starts before the server is listening

  clinic2:
    image: ayurai-c4-federated
    pull_policy: never
    command: ["python", "federated/client.py", "2", "${EPSILON:-2.0}"]
    environment:
      SERVER_ADDRESS: server:8080
    depends_on: [server]
    restart: on-failure

  clinic3:
    image: ayurai-c4-federated
    pull_policy: never
    command: ["python", "federated/client.py", "3", "${EPSILON:-2.0}"]
    environment:
      SERVER_ADDRESS: server:8080
    depends_on: [server]
    restart: on-failure

  # ---------- Databases (profile "db": NOT started by a plain `docker compose up`) ----------
  postgres:
    image: postgres:16-alpine       # alpine variant: smaller download
    container_name: ayurai-postgres
    profiles: ["db"]
    environment:
      # Set these in component4/.env. If the password is missing, PostgreSQL itself
      # refuses to start with a clear error. (Compose's "required" syntax is not used
      # because it would also block a plain `docker compose up` of the federated nodes.)
      POSTGRES_USER: ${POSTGRES_USER:-ayurai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-ayurai_audit}
    ports:
      # 127.0.0.1 = reachable only from this laptop, not from the network (e.g. shared Wi-Fi)
      - "127.0.0.1:5432:5432"
    volumes:
      - ayurai_pgdata:/var/lib/postgresql/data   # data survives container restarts
    # No init.sql: the Component 4 API creates its own tables (users, decisions,
    # hash-chained audit_logs) on startup when DATABASE_URL points here.

  neo4j:
    image: neo4j:5-community
    container_name: ayurai-neo4j
    profiles: ["db"]
    environment:
      # Set NEO4J_PASSWORD (min 8 characters) in component4/.env; Neo4j refuses to start without it
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      # Memory limits so Neo4j fits on an 8 GB laptop
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      # 127.0.0.1 = reachable only from this laptop, not from the network
      - "127.0.0.1:7474:7474"       # browser UI: http://localhost:7474
      - "127.0.0.1:7687:7687"       # Bolt protocol, used by Python drivers
    volumes:
      - ayurai_neo4jdata:/data

volumes:
  ayurai_pgdata:
    name: ayurai_pgdata             # fixed name (otherwise compose prefixes the folder name)
  ayurai_neo4jdata:
    name: ayurai_neo4jdata
