# CI: checks every pull request and every push to main/dev.
# A successful run on main starts the "Deploy" workflow (deploy.yml).
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ayurai-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ayurai-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # tsc -b (type check) + vite build

  component4-tests:
    name: Component 4 API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: component4/requirements-api.txt
      # httpx2: needed by FastAPI's TestClient (test only, not in the image)
      - run: pip install -r component4/requirements-api.txt httpx2
      - run: python -m unittest discover component4/tests -v

  compose-config:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The real .env files are git-ignored; empty ones are enough to validate the file
      - run: touch component2/.env component3/.env component4/.env
      - run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet

  docker-build:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, context: ayurai-client, file: ayurai-client/Dockerfile }
          - { name: c1, context: component1, file: component1/Dockerfile }
          - { name: c2, context: component2, file: component2/Dockerfile }
          - { name: c3, context: component3, file: component3/Dockerfile }
          - { name: c4-api, context: component4, file: component4/Dockerfile.api }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ayurai-${{ matrix.name }}:ci
          push: false
          load: ${{ matrix.name == 'web' }}   # kept locally only for the nginx check below
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: nginx config is valid
        if: matrix.name == 'web'
        run: |
          docker run --rm -e DOMAIN=_ \
            -v "$PWD/deploy/nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
            ayurai-web:ci nginx -t
