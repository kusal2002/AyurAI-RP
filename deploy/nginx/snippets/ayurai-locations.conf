# Shared by http.conf.template and https.conf.template.
# Mirrors the Vite dev proxy: /c2-api/x -> http://c2:8000/x, and so on.

location /c1-api/ {
    set $c1 http://c1:8001;
    rewrite ^/c1-api/(.*)$ /$1 break;
    proxy_pass $c1;
    # Analysis runs several image models on the CPU
    proxy_read_timeout 300s;
}

root /usr/share/nginx/html;
index index.html;
# Component 1 accepts webcam images up to 10 MB; leave room for the upload's form encoding
client_max_body_size 12m;

# Docker's internal DNS. Using variables in proxy_pass makes nginx look the
# backends up per request, so nginx still starts while a backend is down.
resolver 127.0.0.11 valid=30s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location /c2-api/ {
    set $c2 http://c2:8000;
    rewrite ^/c2-api/(.*)$ /$1 break;
    proxy_pass $c2;
    # Reasoning may load an embedding model first (client timeout is 180 s)
    proxy_read_timeout 200s;
}

location /c3-api/ {
    set $c3 http://c3:8003;
    rewrite ^/c3-api/(.*)$ /$1 break;
    proxy_pass $c3;
    proxy_read_timeout 60s;
}

location /c4-api/ {
    set $c4 http://c4-api:8004;
    rewrite ^/c4-api/(.*)$ /$1 break;
    proxy_pass $c4;
    proxy_read_timeout 60s;
}

# Caching uses "expires", not add_header: an add_header here would stop the
# server-level security headers (HSTS etc.) from applying.

# Built JS/CSS have hashed names, so they can be cached for a long time
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Single-page app: unknown paths load index.html and react-router takes over.
# index.html itself is never cached, so a new deploy shows up at once.
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
